name: CimbarFileCopy
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  CimbarFileCopy:
    type: application
    platform: iOS
    sources:
      - path: CimbarFileCopy
        excludes:
          - Resources
    info:
      path: CimbarFileCopy/Info.plist
      properties:
        CFBundleDisplayName: Cimbar 传文件
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 需要使用相机扫描电脑屏幕上的彩色条码，以接收从电脑发送过来的文件。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cimbarfilecopy
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CimbarFileCopy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
